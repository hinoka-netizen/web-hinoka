<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIMS Korporat - PT. Hinoka Alsindo Tekni</title>
    <script>
        // ============================================================
        // SISTEM KEAMANAN KORPORAT - HINOKA EIMS
        // Menggunakan standar enkripsi SHA-256 untuk validasi password.
        // Password Asli tidak disimpan di dalam koding.
        // ============================================================

        // KODE HASH SHA-256 UNTUK PASSWORD ANDA (Generate by System)
        // Password asli yang Anda tetapkan sebelumnya adalah: Hinoka2030
        const HINOKA_PASSWORD_HASH = "6135FF52C90A73583A9627BB5EB007FCAEEB437F3487F0ED1133D472C765D29D"; 

        // Fungsi utilitas untuk mengubah teks menjadi Hash SHA-256 (Asinkron)
        async function generateSHA256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Fungsi Cek Sesi Login
        function cekSesiLogin() {
            const statusLogin = sessionStorage.getItem("hinoka_auth_pro");
            const userAkses = sessionStorage.getItem("hinoka_user");
            
            // Jika belum login, paksa tampilkan modal login
            if (statusLogin !== "verified_pro") {
                document.getElementById("modalLoginPro").style.display = "flex";
            } else {
                // Jika sudah login, tampilkan nama user di navigasi
                document.getElementById("namaUserTampil").innerText = "Hai, " + userAkses;
            }
        }

        // Fungsi Proses Login (Versi Profesional)
        async function prosesLoginPro(event) {
            event.preventDefault();
            const inputSandi = document.getElementById("passwordInputPro").value;
            const btnSubmit = document.getElementById("loginBtnPro");
            const errorMsg = document.getElementById("pesanErrorPro");

            // Ubah tombol menjadi state "Loading"
            btnSubmit.innerText = "Memproses Enkripsi...";
            btnSubmit.disabled = true;

            // Enkripsi input user dan bandingkan dengan hash tersimpan
            const inputHash = await generateSHA256(inputSandi);

            if (inputHash === HINOKA_PASSWORD_HASH) {
                // Login Sukses
                sessionStorage.setItem("hinoka_auth_pro", "verified_pro");
                // Identitas User (kita set statis dulu untuk sekarang, nanti bisa dibuat dinamis)
                sessionStorage.setItem("hinoka_user", "Direksi / Admin"); 
                
                document.getElementById("modalLoginPro").style.display = "none";
                location.reload();
            } else {
                // Login Gagal
                errorMsg.innerText = "Akses Ditolak! Kredensial tidak valid.";
                btnSubmit.innerText = "Masuk Sistem";
                btnSubmit.disabled = false;
            }
        }

        // Fungsi Logout
        function logoutPro() {
            sessionStorage.removeItem("hinoka_auth_pro");
            sessionStorage.removeItem("hinoka_user");
            alert("Sesi Korporat Berhasil Diakhiri.");
            window.location.href = "utama.html";
        }

        // Fungsi Toggle Lihat Password
        function togglePasswordPro() {
            const inputField = document.getElementById("passwordInputPro");
            const btnToggle = document.getElementById("toggleBtnPro");
            if (inputField.type === "password") {
                inputField.type = "text";
                btnToggle.innerText = "Sembunyikan";
            } else {
                inputField.type = "password";
                btnToggle.innerText = "Lihat";
            }
        }
    </script>
