<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIMS Korporat - PT. Hinoka Alsindo Tekni</title>
    <script>
        // ============================================================
        // SISTEM KEAMANAN KORPORAT - HINOKA EIMS V2
        // Password terenkripsi menggunakan SHA-256.
        // ============================================================

        // HASH SHA-256 YANG TELAH DIVERIFIKASI UNTUK "Hinoka2030"
        const HINOKA_PASSWORD_HASH = "4b57c4a2e6082922d657a9433ff8ff866558e7a8386e25c8696753cb9fc585f6"; 

        // Fungsi utilitas untuk mengubah teks menjadi Hash SHA-256 (Asinkron)
        async function generateSHA256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Fungsi Cek Sesi Login
        function cekSesiLogin() {
            const statusLogin = sessionStorage.getItem("hinoka_auth_pro");
            
            if (statusLogin !== "verified_pro") {
                document.getElementById("modalLoginPro").style.display = "flex";
            }
        }

        // Fungsi Proses Login (Versi Profesional)
        async function prosesLoginPro(event) {
            event.preventDefault();
            const inputSandi = document.getElementById("passwordInputPro").value;
            const btnSubmit = document.getElementById("loginBtnPro");
            const errorMsg = document.getElementById("pesanErrorPro");

            btnSubmit.innerText = "Memproses Enkripsi...";
            btnSubmit.disabled = true;

            const inputHash = await generateSHA256(inputSandi);

            if (inputHash === HINOKA_PASSWORD_HASH) {
                // Login Sukses
                sessionStorage.setItem("hinoka_auth_pro", "verified_pro");
                document.getElementById("modalLoginPro").style.display = "none";
                location.reload(); // Muat ulang halaman utama EIMS
            } else {
                // Login Gagal
                errorMsg.innerText = "Akses Ditolak! Kredensial tidak valid.";
                btnSubmit.innerText = "Masuk Sistem";
                btnSubmit.disabled = false;
                document.getElementById("passwordInputPro").value = ""; // Kosongkan input
            }
        }

        // Fungsi Logout
        function logoutPro() {
            sessionStorage.removeItem("hinoka_auth_pro");
            alert("Sesi Korporat Berhasil Diakhiri.");
            window.location.href = "utama.html";
        }
    </script>
    <style>
        :root {
            --primary-bg: #0b0f19;
            --card-bg: #131c2e;
            --accent-teal: #00b4d8;
            --accent-green: #2ec4b6;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --danger-red: #e74c3c;
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .welcome-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            display: inline-block;
            margin-top: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .welcome-card h2 {
            color: var(--accent-green);
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .logout-btn-pro {
            background-color: var(--danger-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 30px;
        }

        /* MODAL LOGIN PRO (Diperbarui) */
        #modalLoginPro {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(11, 15, 25, 0.98); z-index: 9999; 
            justify-content: center; align-items: center;
        }
        .login-box-pro {
            background-color: #131c2e; border: 1px solid #1e293b; 
            padding: 50px; border-radius: 16px; width: 420px; 
            box-shadow: 0 12px 24px rgba(0,0,0,0.6); text-align: center;
        }
        .login-box-pro h2 {
            color: #00b4d8; margin-bottom: 10px; font-size: 1.8em;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .login-instr {
            color: #94a3b8; font-size: 0.95em; margin-bottom: 30px; line-height: 1.5;
        }
        .form-field-pro {
            position: relative; margin-bottom: 20px;
        }
        .form-field-pro input {
            width: 100%; padding: 15px 20px; 
            border-radius: 8px; border: 1px solid #1e293b; 
            background-color: #0b0f19; color: #f1f5f9; box-sizing: border-box; 
            font-size: 1.1em;
        }
        .error-msg-pro {
            color: #e74c3c; font-size: 0.9em; margin-bottom: 20px; font-weight: 600; min-height: 1.2em;
        }
        .submit-login-pro {
            width: 100%; padding: 16px; 
            background-color: #00b4d8; color: #0b0f19; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 1.1em; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: background 0.3s;
        }
        .submit-login-pro:hover { background-color: #2ec4b6; }
        .back-home-pro {
            width: 100%; padding: 12px; background-color: transparent; 
            color: #94a3b8; border: none; margin-top: 15px; cursor: pointer; 
            font-size: 0.9em; text-decoration: underline;
        }
    </style>
</head>
<body onload="cekSesiLogin()">

    <!-- MODAL LOGIN PRO (Pastikan Hash di atas sudah benar) -->
    <div id="modalLoginPro">
        <div class="login-box-pro">
            <h2>Area Korporat</h2>
            <div class="login-instr">
                <div>Masukkan Kunci Akses Anda untuk</div>
                <div>Enterprise Integrated Management System &</div>
                <div style="color: #00b4d8; font-weight: bold;">Dashboard Admin HINOKA</div>
            </div>
            
            <form onsubmit="prosesLoginPro(event)">
                <div class="form-field-pro">
                    <!-- PENTING: Tipe input adalah password -->
                    <input type="password" id="passwordInputPro" placeholder="••••••••" required>
                </div>
                <div id="pesanErrorPro" class="error-msg-pro"></div>
                <button type="submit" id="loginBtnPro" class="submit-login-pro">Masuk Sistem</button>
                <button type="button" onclick="window.location.href='utama.html'" class="back-home-pro">Kembali ke Beranda Publik</button>
            </form>
        </div>
    </div>

    <!-- KONTEN UTAMA EIMS (Tampil setelah login sukses) -->
    <div class="container">
        <div class="welcome-card">
            <h2>SELAMAT DATANG</h2>
            <p>Area Administratif EIMS PT. Hinoka Alsindo Tekni. Modul manajemen mitra dan data sedang dalam pengembangan profesional.</p>
            <button class="logout-btn-pro" onclick="logoutPro()">Logout Korporat</button>
        </div>
    </div>

</body>
</html>
