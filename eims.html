<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMS - Kitab Induk Korporat - PT. Hinoka Alsindo Tekni</title>
    <script>
        // ============================================================
        // HINOKA ENTERPRISE MANAGEMENT SYSTEM (HEMS) - SISTEM OTORISASI
        // ============================================================
        
        // Cek Sesi Login (Keamanan)
        function cekSesiLogin() {
            const statusLogin = sessionStorage.getItem("hinoka_auth_pro");
            if (statusLogin !== "verified_pro") {
                document.getElementById("modalLoginPro").style.display = "flex";
            } else {
                // Jika sudah login, tampilkan nama user di navigasi
                document.getElementById("namaUserTampil").innerText = "Hai, Direksi";
            }
        }

        // Fungsi Proses Login (Sederhana untuk Pengembangan Lokal)
        function prosesLoginPro(event) {
            event.preventDefault();
            const inputSandi = document.getElementById("passwordInputPro").value;
            const errorMsg = document.getElementById("pesanErrorPro");

            if (inputSandi === "Hinoka2030") {
                sessionStorage.setItem("hinoka_auth_pro", "verified_pro");
                document.getElementById("modalLoginPro").style.display = "none";
                location.reload();
            } else {
                errorMsg.innerText = "Akses Ditolak! Kredensial tidak valid.";
                document.getElementById("passwordInputPro").value = "";
            }
        }

        // Fungsi Logout
        function logoutPro() {
            sessionStorage.removeItem("hinoka_auth_pro");
            sessionStorage.removeItem("hinoka_user");
            alert("Sesi Korporat Berhasil Diakhiri.");
            window.location.href = "utama.html";
        }

        // Fungsi Toggle Lihat Password
        function togglePasswordPro() {
            const inputField = document.getElementById("passwordInputPro");
            const btnToggle = document.getElementById("toggleBtnPro");
            if (inputField.type === "password") {
                inputField.type = "text";
                btnToggle.innerText = "Sembunyikan";
            } else {
                inputField.type = "password";
                btnToggle.innerText = "Lihat";
            }
        }
    </script>
    <style>
        /* CSS Korporat Global - HEMS Theme */
        :root {
            --primary-bg: #0b0f19;
            --card-bg: #131c2e;
            --accent-teal: #00b4d8;
            --accent-green: #2ec4b6;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --danger-red: #e74c3c;
            --volume-1: #3498db; /* Biru */
            --volume-5: #f1c40f; /* Kuning Manual Mutu */
            --volume-7: #27ae60; /* Hijau SOP Master */
            --volume-11: #e67e22; /* Oranye Formulir */
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigasi Korporat */
        nav {
            background-color: rgba(19, 28, 46, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 0.95em;
            color: var(--accent-teal);
        }
        .nav-brand img { height: 35px; margin-right: 8px; }
        .nav-links { list-style: none; display: flex; align-items: center; margin: 0; padding: 0; }
        .nav-links li { margin-left: 15px; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-teal); }
        .user-info-display { color: var(--accent-green); font-size: 0.9em; margin-right: 15px; font-weight: bold; }
        .logout-btn-pro {
            background-color: var(--danger-red); color: white; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .logout-btn-pro:hover { background-color: #c0392b; }

        /* Konten Utama HEMS */
        .hems-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }
        .hems-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .hems-header-left h1 {
            color: var(--accent-green);
            font-size: 2em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .hems-header-left p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1em;
        }
        .hems-header-right {
            text-align: right;
            border-left: 2px solid var(--border-color);
            padding-left: 20px;
        }
        .hems-header-right h3 { margin: 0 0 5px 0; color: var(--accent-teal); }
        .hems-header-right p { margin: 0; color: var(--text-muted); font-size: 0.9em; }

        /* Struktur Volume Grid */
        .volume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .volume-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .volume-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,180,216,0.15);
            border-color: var(--accent-teal);
        }
        /* Garis Warna Volume */
        .volume-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
        }
        /* Warna Khusus Volume */
        .vol-1::before { background-color: var(--volume-1); }
        .vol-5::before { background-color: var(--volume-5); }
        .vol-7::before { background-color: var(--volume-7); }
        .vol-11::before { background-color: var(--volume-11); }

        .vol-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .vol-header h2 {
            font-size: 1.3em;
            margin: 0;
            color: var(--text-light);
        }
        .vol-code {
            font-size: 0.8em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.05);
            color: var(--text-muted);
        }
        .vol-desc {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 20px;
            flex: 1;
        }
        .vol-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8em;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .status-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-active { background-color: rgba(46, 204, 113, 0.15); color: var(--accent-green); }
        .status-dev { background-color: rgba(241, 196, 15, 0.15); color: var(--volume-5); }
        .btn-volume {
            background-color: transparent;
            border: 1px solid var(--accent-teal);
            color: var(--accent-teal);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-volume:hover {
            background-color: var(--accent-teal);
            color: var(--primary-bg);
        }

        /* Footer Korporat */
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85em;
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
            background-color: rgba(19, 28, 46, 0.5);
        }

        /* MODAL LOGIN PRO */
        #modalLoginPro {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 15, 25, 0.98); z-index: 9999;
            justify-content: center; align-items: center;
        }
        .login-box-pro {
            background-color: #131c2e; border: 1px solid #1e293b;
            padding: 50px; border-radius: 16px; width: 420px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.6); text-align: center;
        }
        .login-box-pro h2 {
            color: #00b4d8; margin-bottom: 10px; font-size: 1.8em;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .login-instr {
            color: #94a3b8; font-size: 0.95em; margin-bottom: 30px; line-height: 1.5;
        }
        .form-field-pro { position: relative; margin-bottom: 20px; }
        .form-field-pro input {
            width: 100%; padding: 15px 60px 15px 20px;
            border-radius: 8px; border: 1px solid #1e293b;
            background-color: #0b0f19; color: #f1f5f9; box-sizing: border-box;
            font-size: 1.1em;
        }
        .toggle-pass-pro {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #00b4d8; cursor: pointer;
            font-weight: bold; font-size: 0.85em; text-transform: uppercase;
        }
        .error-msg-pro {
            color: #e74c3c; font-size: 0.9em; margin-bottom: 20px;
            font-weight: 600; min-height: 1.2em;
        }
        .submit-login-pro {
            width: 100%; padding: 16px; background-color: #00b4d8;
            color: #0b0f19; border: none; border-radius: 8px; font-weight: bold;
            font-size: 1.1em; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: background 0.3s;
        }
        .submit-login-pro:hover { background-color: #2ec4b6; }
        .back-home-pro {
            width: 100%; padding: 12px; background-color: transparent;
            color: #94a3b8; border: none; margin-top: 15px; cursor: pointer;
            font-size: 0.9em; text-decoration: underline;
        }
    </style>
</head>
