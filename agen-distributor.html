<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Mitra Strategis - PT. Hinoka Alsindo Tekni</title>
    <style>
        :root {
            --primary-bg: #0b0f19;
            --card-bg: #131c2e;
            --accent-teal: #00b4d8;
            --text-light: #f1f5f9;
            --border-color: #1e293b;
        }
        body { background-color: var(--primary-bg); color: var(--text-light); font-family: 'Segoe UI', sans-serif; padding: 40px 20px; }
        .form-container { max-width: 600px; margin: auto; background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-teal); text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0b0f19; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--accent-teal); border: none; border-radius: 6px; color: #0b0f19; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2ec4b6; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registrasi Mitra Strategis</h2>
    <p style="text-align:center; color:#94a3b8;">Mari berkembang bersama PT. Hinoka Alsindo Tekni</p>
    
    <form id="formMitra" onsubmit="alert('Pendaftaran Berhasil! Data Anda sedang diverifikasi oleh Tim HEMS.'); return false;">
        <div class="input-group">
            <label>Nama Lengkap / Nama Perusahaan:</label>
            <input type="text" required>
        </div>
        <div class="input-group">
            <label>Wilayah Operasional:</label>
            <input type="text" placeholder="Contoh: Jakarta, Surabaya, dll." required>
        </div>
        <div class="input-group">
            <label>Unggah Dokumen Legal (KTP/NPWP/NIB):</label>
            <input type="file" accept=".pdf, .jpg, .png">
        </div>
        <div class="input-group">
            <label>Pesan Singkat / Visi Kerjasama:</label>
            <textarea rows="4"></textarea>
        </div>
        <button type="submit">Kirim Aplikasi Kemitraan</button>
    </form>
</div>

</body>
</html>
